# Publishes a Foundry release whenever main carries a module.json version that
# has no release yet (bump "version" in a PR, merge, done). Can also be run by
# hand from the Actions tab.
#
# Install URL for Foundry and The Forge (Bazaar -> "Install via manifest"):
#   https://github.com/whelan/ddb-inventory-sync/releases/latest/download/module.json
name: Release

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version module.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point manifest and download at this release
        if: steps.exists.outputs.exists == 'false'
        run: |
          repo="https://github.com/${{ github.repository }}"
          jq --arg url "$repo" \
             --arg manifest "$repo/releases/latest/download/module.json" \
             --arg download "$repo/releases/download/${{ steps.version.outputs.tag }}/module.zip" \
             '.url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp && mv module.json.tmp module.json
          cat module.json

      - name: Build module.zip
        if: steps.exists.outputs.exists == 'false'
        run: zip -r module.zip module.json scripts README.md $( [ -f LICENSE ] && echo LICENSE )

      - name: Publish release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DDB Inventory Sync ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            module.json
            module.zip

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate module.json
        run: node -e "const m=require('./module.json'); for (const k of ['id','title','version','esmodules','compatibility']) if(!m[k]) throw new Error('module.json is missing '+k)"
      - run: npm ci
      - run: npm test
